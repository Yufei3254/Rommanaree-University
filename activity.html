<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กิจกรรมภายใน | Rommanaree University</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <main class="info-page">
    <div class="info-page__inner">
      <section class="info-hero" aria-labelledby="activity-title">
        <p class="info-hero__eyebrow">ROMMANAREE UNIVERSITY</p>
        <h1 id="activity-title">กิจกรรมภายใน</h1>
        <p>เลือกดูกิจกรรมและประเพณีของมหาวิทยาลัยร่มนารี</p>
      </section>
      <nav class="announcement-list" aria-label="สารบัญกิจกรรม">
        <a class="announcement-card activity-directory-card" href="welcomingactivities.html">
          <span class="announcement-card__category">กิจกรรมรับน้อง</span>
          <h2>พิธีเสี่ยงมาลา</h2>
          <p>เรียนรู้ประเพณีและความหมายของพิธีเสี่ยงมาลา</p>
          <img class="activity-card__image" src="assets/ร่มนารี/rabnong.png" alt="โปสเตอร์กิจกรรมพิธีเสี่ยงมาลา">
          <span class="activity-directory-card__more">อ่านเพิ่มเติม </span>
        </a>
        <a class="announcement-card activity-directory-card" href="loykrathong.html">
          <span class="announcement-card__category">เทศกาลประจำปี</span>
          <h2>ประเพณีวันลอยกระทง</h2>
          <p>ร่วมชมกระทงเทียนและบรรยากาศกิจกรรมยามค่ำคืนของมหาวิทยาลัย</p>
          <img class="activity-card__image" src="assets/ร่มนารี/image0.jpg" alt="ตัวอย่างบรรยากาศงานลอยกระทง">
          <span class="activity-directory-card__more">อ่านเพิ่มเติม </span>
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
