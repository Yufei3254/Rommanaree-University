<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rommanaree University | เร็ว ๆ นี้</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    }
    .font-heading { font-family: 'Noto Serif Thai', serif; }

    /* ---------- Coming Soon ---------- */
    .cs {
      position: relative;
      display: grid;
      flex: 1;
      padding: 24px;
      place-items: center;
      overflow: hidden;
      color: #173332;
      background: #f4f7f6;
    }

    .cs::before,
    .cs::after {
      position: absolute;
      content: "";
      border: 1px solid #165d5a;
      border-radius: 50%;
      opacity: .12;
      pointer-events: none;
    }
    .cs::before { width: 520px; height: 520px; top: -200px; right: -140px; }
    .cs::after  { width: 340px; height: 340px; bottom: -150px; left: -90px; }

    .cs__inner {
      position: relative;
      z-index: 1;
      max-width: 560px;
      text-align: center;
    }

    .cs__eyebrow {
      margin: 0 0 18px;
      color: #165d5a;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .28em;
    }

    .cs__title {
      margin: 0;
      color: #123f3c;
      font-family: 'Noto Serif Thai', serif;
      font-size: clamp(3rem, 11vw, 5.5rem);
      font-weight: 600;
      line-height: 1.3;
    }

    .cs__rule {
      display: block;
      width: 56px;
      height: 2px;
      margin: 26px auto;
      background: #165d5a;
    }

    .cs__text {
      margin: 0 0 34px;
      color: #647674;
      font-size: 1.05rem;
      line-height: 1.9;
    }

    .cs__link {
      display: inline-block;
      padding: 11px 28px;
      color: #165d5a;
      border: 1px solid #165d5a;
      border-radius: 999px;
      text-decoration: none;
      transition: background-color .2s ease, color .2s ease;
    }
    .cs__link:hover { color: #fff; background: #165d5a; }

    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 0 0 28px;
    }

    .contact-socials__link {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      color: #165d5a;
      background: #fff;
      border: 1px solid rgb(22 93 90 / 20%);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgb(8 35 34 / 8%);
      transition: color .2s ease, background-color .2s ease, transform .2s ease;
    }

    .contact-socials__link:hover,
    .contact-socials__link:focus-visible {
      color: #fff;
      background: #165d5a;
      transform: translateY(-3px);
    }

    .contact-socials__link:focus-visible {
      outline: 3px solid #8bd1b1;
      outline-offset: 3px;
    }

    .contact-socials__link svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .contact-socials__link--instagram svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .contact-socials__link--instagram .contact-socials__dot {
      fill: currentColor;
      stroke: none;
    }

    .contact-socials__link--soon {
      color: #9aa9a5;
      background: #edf1ef;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-height: 560px) {
      .cs__rule { margin: 16px auto; }
      .cs__text { margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="w-full px-4 md:px-6">
      <div class="flex items-center h-20">
        <a href="index.html" class="justify-self-start flex items-center gap-3">
          <img src="assets/ร่มนารี/Logo.PNG" alt="MRN_AU" class="h-12 w-12 object-contain">
          <span class="font-heading text-lg md:text-xl font-bold leading-normal" style="color: whitesmoke">
            <span class="block">Rommanaree</span>
            <span class="block ml-3 mt-1">University</span>
          </span>
        </a>
        <nav class="hidden-menu" aria-label="เมนูหลัก">
          <details class="nav-dropdown">
            <summary>เกี่ยวกับเรา</summary>
            <div class="nav-dropdown__menu">
              <a href="about.html">ประวัติสถาบัน</a>
              <a href="contact.html">ติดต่อเรา</a>
            </div>
          </details>
          <details class="nav-dropdown">
            <summary>การศึกษา</summary>
            <div class="nav-dropdown__menu">
              <a href="faculty.html">คณะและสาขา</a>
              <a href="rule.html">กฎระเบียบ</a>
            </div>
          </details>
          <details class="nav-dropdown">
            <summary>ชีวิตในร่มนารี</summary>
            <div class="nav-dropdown__menu">
              <a href="activity.html">กิจกรรมภายใน</a>
              <a href="club.html">ชมรม</a>
            </div>
          </details>
        </nav>
        <a href="application.html" class="apply-button hidden md:inline-block ml-6 text-white text-sm font-medium px-5 py-2.5 rounded-full transition-colors">
          สมัครเข้าศึกษา
        </a>
      </div>
    </div>
  </header>

  <main class="cs">
    <div class="cs__inner">
      <p class="cs__eyebrow">ROMMANAREE UNIVERSITY</p>
      <h1 class="cs__title">ติดต่อเรา</h1>
      <span class="cs__rule" aria-hidden="true"></span>
      <p class="cs__text">
        ติดตามข่าวสารและพูดคุยกับมหาวิทยาลัยร่มนารีได้ทางช่องทางโซเชียลมีเดีย
      </p>
      <nav class="contact-socials" aria-label="ช่องทางติดต่อ">
        <a class="contact-socials__link" href="https://www.facebook.com/profile.php?id=61594916923483" aria-label="Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.6 1.6-1.6h1.7V3.8c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.3v3h2.8v8h3.4Z"/></svg>
        </a>
        <a class="contact-socials__link contact-socials__link--instagram" href="https://www.instagram.com/rommanaree.arttag.official_?vrfl=MWIybXNoaGMwejZ2NA%3D%3D&utm_source=qr" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="contact-socials__dot" cx="17.5" cy="6.8" r="1"/></svg>
        </a>
        <span class="contact-socials__link contact-socials__link--soon" role="img" aria-label="Discord — Coming soon" title="Discord — Coming soon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 5.5A18 18 0 0 0 15.2 4l-.5 1a16 16 0 0 0-5.4 0l-.5-1a18 18 0 0 0-4.3 1.5C1.8 9.5 1.1 13.4 1.5 17.2a18 18 0 0 0 5.3 2.7l1.1-1.8-1.7-.8.4-.3a12.8 12.8 0 0 0 10.8 0l.4.3-1.7.8 1.1 1.8a18 18 0 0 0 5.3-2.7c.5-4.4-.8-8.3-3-11.7ZM8.8 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
        </span>
      </nav>
      <a href="index.html" class="cs__link">กลับหน้าหลัก</a>
    </div>
  </main>
</body>
</html>
